        if(!title){ toast("Give the task a name.", "err"); return; }
        const data = { title, status:$("#tf_status", o).value, priority:$("#tf_pri", o).value,
          due:$("#tf_due", o).value, assignee:$("#tf_asg", o).value, recurrence:$("#tf_rec", o).value,
          notes:$("#tf_notes", o).value };
        if(isNew) DB.tasks.push(Object.assign({ id:uid("t"), created:todayISO() }, data));
        else Object.assign(t, data);
        closeModal(); refresh(); toast(isNew ? "Task added" : "Task updated");
      });
      $("#tf_del", o)?.addEventListener("click", () => {
        DB.tasks = DB.tasks.filter(x => x.id !== t.id); closeModal(); refresh(); toast("Task deleted");
      });
    }
  });

viewState.reports = { range:"ytd" };
function rangeBounds(r){
  const T = todayISO(), d = new Date();
  if(r === "month") return [T.slice(0,7) + "-01", T];
  if(r === "quarter"){ const q = Math.floor(d.getMonth()/3)*3; return [d.getFullYear() + "-" + pad(q+1) + "-01", T]; }
  if(r === "ytd") return [d.getFullYear() + "-01-01", T];
  if(r === "12mo") return [addDaysISO(T, -365), T];
  return ["0000-01-01", T];
}

function downloadDataUrl(d){
  const a = document.createElement("a");

  document.body.appendChild(a); a.click(); a.remove();
}
async function uploadDocument(){
  const files = await pickFile("", true);
  if(!files || !files.length) return;
  for(const f of files){
    if(f.size > 3 * 1024 * 1024){ toast(f.name + " is over 3 MB — too large for browser storage.", "err"); continue; }
    try{
      const data = f.type.startsWith("image/") ? await readImage(f, 1400, 0.78) : await readFileData(f);
      DB.documents.push({ id:uid("doc"), name:f.name, type:f.type, size:f.size,
        category:f.type.startsWith("image/") ? "Photo" : "Other", clientId:"", data, created:todayISO() });
    }catch(e){ toast("Couldn't read " + f.name, "err"); }
  }
  save(true); refresh(); toast(files.length > 1 ? "Files uploaded" : "File uploaded");
}

      const data = JSON.parse(text);
      if(!data || !Array.isArray(data.clients)) throw new Error("not a ServiceFlow backup");
      confirmDialog("Restore this backup?", "Everything currently in the workspace will be replaced by the contents of " + f.name + ".", "Restore", () => {
        DB = Object.assign(blankDB(), data);
        save(true); applyTheme(); renderNav(); render("dashboard", true); toast("Backup restored");
      });
    }catch(e){ toast("That file isn't a ServiceFlow backup.", "err"); }
  });
  $("#reseed")?.addEventListener("click", () => {
    confirmDialog("Reload demo data?", "The sample company is restored and anything you've entered is replaced.", "Reload demo", () => {
      DB = blankDB(); seed(); save(true); applyTheme(); renderNav(); render("dashboard", true); toast("Demo data reloaded");
    });
  });
  $("#wipe")?.addEventListener("click", () => {
    confirmDialog("Erase everything?", "Every client, job, invoice, payment and file is deleted from this browser. This cannot be undone.", "Erase everything", () => {
      DB = blankDB(); DB.settings.seeded = true; save(true); applyTheme(); renderNav(); render("dashboard", true); toast("Workspace cleared");
    });
  });
  $("#kbdHint2") && ($("#kbdHint2").textContent = isMac() ? "⌘K" : "Ctrl K");
};

/* ============================================================
   Theme
   ============================================================ */
const isMac = () => /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
function applyTheme(){
  document.documentElement.dataset.theme = DB.settings.theme || "light";
  document.documentElement.dataset.accent = DB.settings.accent || "sage";
  $("#themeBtn").innerHTML = icon(DB.settings.theme === "dark" ? "sun" : "moon");
  $("#userName").textContent = DB.settings.business.name;
  $("#userAvatar").textContent = initials(DB.settings.business.name);
}
function setTheme(t){
  DB.settings.theme = t;
  applyTheme(); save();
  if(route === "settings") render("settings", false);
}

/* ============================================================
   Global search (command palette)
   ============================================================ */
let cmdkOpen = false, cmdkIndex = 0, cmdkResults = [];
function buildResults(q){
  const query = q.toLowerCase().trim();
  const out = [];
  const push = (group, title, subtitle, iconName, action, right) => out.push({ group, title, subtitle, icon:iconName, action, right });
  MODULES.filter(m => !query || m.label.toLowerCase().includes(query) || m.id.includes(query))
    .slice(0, query ? 4 : 15).forEach(m => push("Go to", m.label, m.group, m.icon, () => go(m.id)));
  if(!query) return out;
  DB.clients.filter(c => [c.name, c.company, c.email, c.phone, (c.tags||[]).join(" ")].join(" ").toLowerCase().includes(query))
    .slice(0, 5).forEach(c => push("Clients", c.name, c.company || c.email || "", "clients", () => openClient(c), money(clientLifetime(c.id), { round:true })));
  DB.jobs.filter(j => [j.title, j.service, clientName(j.clientId)].join(" ").toLowerCase().includes(query))
    .slice(0, 5).forEach(j => push("Jobs", j.title, fmtDate(j.date) + " · " + label(j.status), "jobs", () => openJob(j), money(j.price, { round:true })));
  DB.invoices.filter(i => [i.number, clientName(i.clientId)].join(" ").toLowerCase().includes(query))
    .slice(0, 5).forEach(i => push("Invoices", i.number, clientName(i.clientId) + " · " + label(invoiceStatus(i)), "invoices", () => openInvoice(i), money(docTotals(i).total, { round:true })));
  DB.quotes.filter(q2 => [q2.number, clientName(q2.clientId)].join(" ").toLowerCase().includes(query))
    .slice(0, 3).forEach(q2 => push("Estimates", q2.number, clientName(q2.clientId), "quotes", () => openQuote(q2), money(docTotals(q2).total, { round:true })));
  DB.tasks.filter(t => t.title.toLowerCase().includes(query))
    .slice(0, 4).forEach(t => push("Tasks", t.title, label(t.status) + (t.due ? " · due " + fmtDate(t.due, "short") : ""), "tasks", () => taskForm(t)));
  DB.expenses.filter(e => [e.vendor, e.category].join(" ").toLowerCase().includes(query))
    .slice(0, 4).forEach(e => push("Expenses", e.vendor, e.category + " · " + fmtDate(e.date, "short"), "expenses", () => expenseForm(e), money(e.amount, { round:true })));
  DB.employees.filter(e => [e.name, e.role].join(" ").toLowerCase().includes(query))
    .slice(0, 3).forEach(e => push("Team", e.name, e.role, "employees", () => employeeForm(e)));
  DB.inventory.filter(i => [i.name, i.sku, i.supplier].join(" ").toLowerCase().includes(query))
    .slice(0, 3).forEach(i => push("Inventory", i.name, i.sku + " · " + i.qty + " on hand", "inventory", () => inventoryForm(i)));
  DB.documents.filter(d => d.name.toLowerCase().includes(query))
    .slice(0, 3).forEach(d => push("Documents", d.name, d.category, "docs", () => { go("documents"); }));
  return out;
}
function paintCmdk(){
  const list = $("#cmdkList");
  if(!list) return;
  if(!cmdkResults.length){
    list.innerHTML = `<div style="padding:34px 20px;text-align:center">
      <div class="muted fs-13">Nothing matches that.</div>
      <div class="cell-sub mt-1">Try a client name, an invoice number, or a module.</div></div>`;
    return;
  }
  let html = "", lastGroup = "";
  cmdkResults.forEach((r, i) => {
    if(r.group !== lastGroup){ html += `<div class="cmdk-group">${esc(r.group)}</div>`; lastGroup = r.group; }
    html += `<button class="cmdk-item ${i === cmdkIndex ? "sel" : ""}" data-i="${i}">
      ${icon(r.icon)}<span class="grow"><span class="t">${esc(r.title)}</span>${r.subtitle ? `<span class="s">${esc(r.subtitle)}</span>` : ""}</span>
      ${r.right ? `<span class="r">${esc(r.right)}</span>` : ""}</button>`;
  });
  list.innerHTML = html;
  $$("#cmdkList .cmdk-item").forEach(b => {
    b.addEventListener("mouseenter", () => { cmdkIndex = Number(b.dataset.i); $$("#cmdkList .cmdk-item").forEach(x => x.classList.toggle("sel", x === b)); });
    b.addEventListener("click", () => runCmdk(Number(b.dataset.i)));
  });
}
function runCmdk(i){
  const r = cmdkResults[i];
  closeCmdk();
  if(r) setTimeout(r.action, 60);
}
function openCmdk(){
  if(cmdkOpen) return;
  cmdkOpen = true; cmdkIndex = 0;
  const root = $("#cmdkRoot");
  root.innerHTML = `<div class="cmdk" id="cmdkOverlay">
    <div class="cmdk-box" role="dialog" aria-label="Search">
      <div class="cmdk-input">${icon("search")}
        <input id="cmdkInput" placeholder="Search clients, jobs, invoices, expenses…" autocomplete="off" spellcheck="false">
        <span class="kbd">esc</span></div>
      <div class="cmdk-list" id="cmdkList"></div>
      <div class="cmdk-foot"><span>↑↓ to move</span><span>↵ to open</span><span>esc to close</span></div>
    </div></div>`;
  cmdkResults = buildResults("");
  paintCmdk();
  const input = $("#cmdkInput");
  input.focus();
  input.addEventListener("input", () => { cmdkResults = buildResults(input.value); cmdkIndex = 0; paintCmdk(); });
  $("#cmdkOverlay").addEventListener("mousedown", e => { if(e.target.id === "cmdkOverlay") closeCmdk(); });
}
function closeCmdk(){ cmdkOpen = false; $("#cmdkRoot").innerHTML = ""; }

/* ============================================================
   Quick create
   ============================================================ */
function quickCreate(kind){
  const map = { job:jobForm, invoice:invoiceForm, client:clientForm, expense:expenseForm,
    task:taskForm, payment:paymentForm, quote:quoteForm, employee:employeeForm, item:inventoryForm };
  if(kind && map[kind]) return map[kind]();
  openModal({
    title:"Create something", sub:"Pick what you're adding", size:"sm",
    body:`<div class="vstack" style="gap:6px">${[
      ["job","Job","Book work on the calendar","jobs"],
      ["invoice","Invoice","Bill a client","invoices"],
      ["quote","Estimate","Price a job before it starts","quotes"],
      ["payment","Payment","Record money received","payments"],
      ["expense","Expense","Log money spent","expenses"],
      ["client","Client","Add someone to the CRM","clients"],
      ["task","Task","Something to get done","tasks"]
    ].map(([k, t, s, ic]) => `<button class="list-item" data-create="${k}" style="width:100%;text-align:left">
      <span class="icon-badge">${icon(ic)}</span>
      <span class="grow"><span class="cell-title">${t}</span><span class="cell-sub">${s}</span></span>
      ${icon("arrowRight")}</button>`).join("")}</div>`,
    onMount(o){
      $$("[data-create]", o).forEach(b => b.addEventListener("click", () => { closeModal(); setTimeout(() => map[b.dataset.create](), 80); }));
    }
  });
}

/* ============================================================
   Boot
   ============================================================ */
function bindShell(){
  $("#searchBtn").addEventListener("click", openCmdk);
  $("#quickAddBtn").innerHTML = icon("plus");
  $("#quickAddBtn").addEventListener("click", () => quickCreate());
  $("#settingsBtn").innerHTML = icon("settings");
  $("#settingsBtn").addEventListener("click", () => go("settings"));
  $("#themeBtn").addEventListener("click", () => setTheme(DB.settings.theme === "dark" ? "light" : "dark"));
  $("#menuBtn").innerHTML = icon("menu");
  $("#menuBtn").addEventListener("click", () => {
    const sb = $("#sidebar");
    sb.classList.add("open");
    const scrim = document.createElement("div");
    scrim.className = "scrim";
    scrim.addEventListener("click", () => { sb.classList.remove("open"); scrim.remove(); });
    // append inside .app (the sidebar's own stacking context) rather than
    // <body> — a sibling of .app with a higher z-index would out-rank the
    // whole .app stacking context (sidebar included) and silently swallow
    // taps on the nav items even though the sidebar still looked on top
    $(".app").appendChild(scrim);
  });
  $("#userChip").addEventListener("click", () => go("settings"));
  $("#kbdHint").textContent = isMac() ? "⌘K" : "Ctrl K";

  document.addEventListener("keydown", e => {
    const typing = /input|textarea|select/i.test(e.target.tagName);
    if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); cmdkOpen ? closeCmdk() : openCmdk(); return; }
    if(e.key === "/" && !typing && !cmdkOpen && !modalStack.length){ e.preventDefault(); openCmdk(); return; }
    if(e.key === "Escape"){
      if(cmdkOpen) closeCmdk();
      else if(modalStack.length) closeModal();
      return;
    }
    if(cmdkOpen){
      if(e.key === "ArrowDown"){ e.preventDefault(); cmdkIndex = Math.min(cmdkResults.length - 1, cmdkIndex + 1); paintCmdk(); scrollSel(); }
      else if(e.key === "ArrowUp"){ e.preventDefault(); cmdkIndex = Math.max(0, cmdkIndex - 1); paintCmdk(); scrollSel(); }
      else if(e.key === "Enter"){ e.preventDefault(); runCmdk(cmdkIndex); }
    }
  });
  function scrollSel(){ $("#cmdkList .cmdk-item.sel")?.scrollIntoView({ block:"nearest" }); }
  window.addEventListener("beforeunload", () => save(true));
}

function boot(){
  load();
  applyTheme();
  bindShell();
  const start = (location.hash || "").replace("#/", "") || "dashboard";
  render(MODULES.some(m => m.id === start) ? start : "dashboard", true);
}
boot();
</script>
